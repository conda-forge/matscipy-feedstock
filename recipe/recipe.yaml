schema_version: 1

context:
  name: matscipy
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/matscipy-${{ version }}.tar.gz
  sha256: 3f49a6af5a1c5cdc5a8530e44e861b8dbaea94dd85a32ca54eecf07b492612ba
  patches:
    - if: linux
      then: version.patch

build:
  number: 0
  skip: win

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ninja
  host:
    - python
    - python-build
    - meson >=1.0.0
    - meson-python >=0.13.0
    - numpy
    - pip
  run:
    - python
    - numpy >=1.16.0
    - scipy >=1.2.3
    - ase >=3.16.0
    - looseversion

tests:
  - python:
      imports:
        - matscipy
      pip_check: true

about:
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: Materials science with Python at the atomic-scale
  description: |
    This repository contains generic Python materials science tools built
    around the Atomic Simulation Environment (ASE).
  homepage: https://github.com/libAtoms/matscipy
  repository: https://github.com/libAtoms/matscipy
  documentation: https://github.com/libAtoms/matscipy

extra:
  recipe-maintainers:
    - jan-janssen
